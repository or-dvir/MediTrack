<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1080" viewBox="0 0 1620 1080">
  <defs>
    <filter id="shadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#202343" flood-opacity=".12"/>
    </filter>
    <style>
      .ui { font-family: Inter, 'Segoe UI', Arial, sans-serif; fill: #22243a; }
      .muted { fill: #66697d; }
      .title { font-size: 23px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .tiny { font-size: 10px; }
      .pill { font-size: 13px; font-weight: 700; fill: #fff; }
      .tag { font-size: 13px; font-weight: 700; letter-spacing: .4px; fill: #545fc0; }
      .error { fill: #ba1b1b; }
    </style>
  </defs>
  <rect width="1620" height="1080" fill="#f3f3f8"/>
  <text x="55" y="62" class="ui" font-size="31" font-weight="750">Forgot password · screen direction</text>
  <text x="55" y="93" class="ui muted" font-size="15">Three states on one screen flow · auth styling is exploratory and will be matched across screens before implementation</text>

  <!-- panel 1 -->
  <g transform="translate(40 128)">
    <rect width="500" height="850" rx="24" fill="#fff"/>
    <text x="28" y="39" class="ui tag">01 · ENTER EMAIL</text>
    <text x="28" y="63" class="ui small muted">Prefilled only when login already has an address</text>
    <g transform="translate(90 91)">
      <rect width="320" height="720" rx="37" fill="#1e2030" filter="url(#shadow)"/>
      <rect x="8" y="8" width="304" height="704" rx="30" fill="#fff"/>
      <rect x="125" y="14" width="70" height="7" rx="4" fill="#1e2030"/>
      <text x="27" y="48" class="ui" font-size="20">‹</text>
      <circle cx="160" cy="91" r="25" fill="#eeedff"/>
      <rect x="147" y="84" width="26" height="17" rx="3" fill="#fff" stroke="#5964c8" stroke-width="1.5"/>
      <path d="M148 85 L160 94 L172 85" fill="none" stroke="#5964c8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="153" class="ui title">Reset password</text>
      <text x="28" y="189" class="ui body muted">Enter the email address associated</text>
      <text x="28" y="210" class="ui body muted">with your account.</text>
      <rect x="26" y="245" width="268" height="58" rx="12" fill="#fff" stroke="#787b8f" stroke-width="1.4"/>
      <text x="42" y="265" class="ui tiny muted">Email</text>
      <text x="42" y="288" class="ui body">alex@example.com</text>
      <rect x="34" y="333" width="252" height="50" rx="25" fill="#5964c8"/>
      <text x="160" y="364" text-anchor="middle" class="ui pill">Send reset link</text>
      <text x="160" y="450" text-anchor="middle" class="ui small" fill="#5964c8" font-weight="700">Back to login</text>
      <text x="160" y="664" text-anchor="middle" class="ui tiny muted">If login email is blank, this field starts blank.</text>
    </g>
  </g>

  <!-- panel 2 -->
  <g transform="translate(560 128)">
    <rect width="500" height="850" rx="24" fill="#fff"/>
    <text x="28" y="39" class="ui tag">02 · RESET LINK SENT</text>
    <text x="28" y="63" class="ui small muted">Stay here; user chooses when to return to login</text>
    <g transform="translate(90 91)">
      <rect width="320" height="720" rx="37" fill="#1e2030" filter="url(#shadow)"/>
      <rect x="8" y="8" width="304" height="704" rx="30" fill="#fff"/>
      <rect x="125" y="14" width="70" height="7" rx="4" fill="#1e2030"/>
      <text x="27" y="48" class="ui" font-size="20">‹</text>
      <circle cx="160" cy="91" r="25" fill="#eeedff"/>
      <rect x="147" y="84" width="26" height="17" rx="3" fill="#fff" stroke="#5964c8" stroke-width="1.5"/>
      <path d="M148 85 L160 94 L172 85" fill="none" stroke="#5964c8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="178" cy="106" r="10" fill="#358b72"/>
      <path d="M173 106 L177 110 L184 102" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="160" y="153" text-anchor="middle" class="ui title">Check your email</text>
      <text x="160" y="189" text-anchor="middle" class="ui body muted">We sent a password reset link to</text>
      <text x="160" y="213" text-anchor="middle" class="ui body" font-weight="700">alex@example.com</text>
      <text x="160" y="250" text-anchor="middle" class="ui small muted">Check your inbox or spam folder, then</text>
      <text x="160" y="269" text-anchor="middle" class="ui small muted">follow the link to set a new password.</text>
      <text x="160" y="345" text-anchor="middle" class="ui small" fill="#5964c8" font-weight="700">Back to login</text>
      <text x="160" y="410" text-anchor="middle" class="ui small muted">Didn't receive the email?</text>
      <text x="160" y="434" text-anchor="middle" class="ui small" fill="#5964c8" font-weight="700">Resend in 00:42</text>
      <text x="160" y="664" text-anchor="middle" class="ui tiny muted">Timer begins when the initial email is sent.</text>
    </g>
  </g>

  <!-- panel 3 -->
  <g transform="translate(1080 128)">
    <rect width="500" height="850" rx="24" fill="#fff"/>
    <text x="28" y="39" class="ui tag">03 · EMAIL ERROR</text>
    <text x="28" y="63" class="ui small muted">Keep the address; explain what the user can do</text>
    <g transform="translate(90 91)">
      <rect width="320" height="720" rx="37" fill="#1e2030" filter="url(#shadow)"/>
      <rect x="8" y="8" width="304" height="704" rx="30" fill="#fff"/>
      <rect x="125" y="14" width="70" height="7" rx="4" fill="#1e2030"/>
      <text x="27" y="48" class="ui" font-size="20">‹</text>
      <circle cx="160" cy="91" r="25" fill="#eeedff"/>
      <rect x="147" y="84" width="26" height="17" rx="3" fill="#fff" stroke="#5964c8" stroke-width="1.5"/>
      <path d="M148 85 L160 94 L172 85" fill="none" stroke="#5964c8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="178" cy="106" r="10" fill="#ba1b1b"/>
      <path d="M174 102 L182 110 M182 102 L174 110" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
      <text x="28" y="153" class="ui title">Reset password</text>
      <text x="28" y="189" class="ui body muted">Enter the email address associated</text>
      <text x="28" y="210" class="ui body muted">with your account.</text>
      <rect x="26" y="245" width="268" height="58" rx="12" fill="#fff" stroke="#ba394a" stroke-width="1.6"/>
      <text x="42" y="265" class="ui tiny muted">Email</text>
      <text x="42" y="288" class="ui body">alex@example.com</text>
      <text x="38" y="315" class="error tiny">No account found for this email.</text>
      <text x="38" y="331" class="error tiny">Check the address or register.</text>
      <rect x="34" y="380" width="252" height="50" rx="25" fill="#5964c8"/>
      <text x="160" y="411" text-anchor="middle" class="ui pill">Send reset link</text>
      <text x="160" y="476" text-anchor="middle" class="ui small" fill="#5964c8" font-weight="700">Back to login</text>
      <text x="160" y="664" text-anchor="middle" class="ui tiny muted">Exact error copy is a placeholder.</text>
    </g>
  </g>

  <text x="55" y="1030" class="ui small muted">Placeholder design. Illustrative address and countdown only; final copy, palette, icon and shared auth styling remain to be decided.</text>
</svg>
